name: chrome
on:
  push:
    paths: ['chrome/**', '.github/workflows/chrome.yml']
  pull_request:
    paths: ['chrome/**', '.github/workflows/chrome.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: manifest and profiles parse
        run: for f in manifest.json profiles/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
